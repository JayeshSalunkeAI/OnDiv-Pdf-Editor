            ],
            "screenshot": "__SITE_URL__/og-image.png",
            "publisher": {
              "@type": "Organization",
              "name": "OnDiv",
              "url": "__SITE_URL__/"
            }
          },
          {
            "@type": "FAQPage",
            "@id": "__SITE_URL__/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Do my PDFs get uploaded?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. OnDiv PDF Editor processes files inside your browser tab. Your document is never uploaded to a server. The OCR engine and language data are downloaded from a CDN the first time you use OCR, but the PDF itself stays on your device."
                }
              },
              {
                "@type": "Question",
                "name": "Can I edit a scanned PDF?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. OCR turns the page image into editable words and lines. Click a word to change just that word, or click the whitespace to edit the whole line. Bold detection marks likely bold words, and the B/I/U toggles let you correct it. When you export with searchable OCR enabled, the scan keeps its appearance and gains a selectable, searchable text layer."
                }
              },
              {
                "@type": "Question",
                "name": "Is redaction permanent?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. The Redact tool flattens affected pages into images inside a freshly rebuilt PDF, removes annotations and document metadata, and verifies on export that no extractable text still overlaps a redaction box. The Cover tool is visual only."
                }
              },
              {
                "@type": "Question",
                "name": "Which browsers are supported?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "OnDiv PDF Editor works in current versions of Chrome, Edge, Firefox and Safari. Performance is best in Chrome or Edge. Password-protected PDFs and pages with a rotation entry are not supported yet."
                }
              }
            ]
          }
        ]
      }
